[package]
name = "wl-app"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Worldline desktop client (Tauri v2 + Dioxus)"
default-run = "wl-app"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wl-core = { path = "../wl-core" }
wl-sync = { path = "../wl-sync" }
wl-protocol = { path = "../wl-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
zeroize = "1"
getrandom = "0.2"
iota_stronghold = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
# NOTE: tauri-plugin-stronghold stays as a dependency but is deliberately
# NOT registered as a plugin — its JS commands would expose a second,
# zero-keyed vault to the webview. The shell owns `vault::Vault` instead.
# tauri-plugin-global-shortcut was removed along with the global summon
# hotkey feature.

[dev-dependencies]
wl-relay = { path = "../wl-relay" }
axum = { version = "0.8", features = ["json", "tokio"] }
# `tauri/test` is the mock-runtime harness (`mock_builder`,
# `get_ipc_response`) used by `src/ipc_tests.rs` to drive the real
# `generate_handler!` over a real IPC payload. It pulls in no extra
# dependencies (`test = []` upstream) and is only linked for test builds.
tauri = { version = "2", features = ["test"] }

[features]
# compiled with cargo tauri build / dev
custom-protocol = ["tauri/custom-protocol"]

# Match the root workspace's release discipline (this crate is its own
# workspace, so the root [profile.release] does not apply here).
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
