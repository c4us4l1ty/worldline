<!DOCTYPE html>
<!--
  Worldline design preview — a static render of every screen's markup
  against the real `public/wl.css`.

  WHY THIS EXISTS. Verifying the UI has historically meant running the
  Tauri shell (needs gtk/webkit headers) or `dx serve` and driving a real
  browser. Both are slow, and `dx serve` needs the wasm module to boot
  before anything is visible, which makes a headless screenshot of a
  partially-booted app worthless. So the visual pass had been done by
  reading the stylesheet, which is exactly how thirteen rules came to
  reference a token that was defined nowhere.

  This harness removes the wasm from the loop entirely: the markup below
  is the same class structure the rsx emits, and it loads the same
  stylesheet the app ships. What you see is what the app renders. It is
  DEV-ONLY and deliberately NOT copied into the Tauri bundle — it lives
  beside `index.html` rather than in `public/`, so `dx`'s asset copier
  never sees it.

  Open it directly:  firefox crates/wl-app/ui/preview.html
  or serve the ui/ directory and visit /preview.html.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldline — design preview</title>
    <link rel="stylesheet" href="./public/wl.css" />
    <style>
      /* Harness chrome ONLY. Nothing here touches a wl- class. */
      body {
        max-width: none;
        background: #0a0a09;
        overflow: auto;
        padding: 40px 20px 80px;
      }
      .harness {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        align-items: flex-start;
        justify-content: center;
      }
      .frame {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      .frame > figcaption {
        font: 500 12px ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b6862;
      }
      /* Exactly the app's own viewport, so what is checked here is the
         layout that ships. */
      .phone {
        width: 420px;
        height: 747px;
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid #242422;
        background: var(--wl-canvas);
        display: flex;
        flex-direction: column;
        padding: 20px 18px 22px;
      }
      .phone > * { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <script>
      // Stand in for programmatic focus: the canvas root is focused on
      // every boot (that is how it receives ⌘+Enter and Escape), so this
      // is the state the focus-ring rule has to survive. A static
      // screenshot cannot focus anything, so apply the class on load.
      document.addEventListener('DOMContentLoaded', function () {
        var r = document.querySelector('.wl-root[autofocus]');
        if (r) { r.classList.add('focus'); }
      });
    </script>
    <div class="harness">

      <!-- ================= CANVAS: active directive ================= -->
      <figure class="frame">
        <figcaption>canvas · directive</figcaption>
        <div class="phone">
          <div class="wl-root">
            <div class="wl-float-layer">
              <button class="wl-circle-btn wl-float-menu" aria-label="Open navigation">
                <svg class="wl-icon wl-icon-menu" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" /></svg>
              </button>
            </div>
            <main class="wl-directive-container">
              <div class="wl-directive-card wl-card-enter">
                <div class="wl-directive-step-badge">Phase 1 of 3 · 25 min</div>
                <h1 class="wl-directive-title">Draft the initial schema migrations for SQLite persistence</h1>
                <p class="wl-directive-instruction">Define tables for <code class="wl-code">identity_config</code> and <code class="wl-code">crdt_outbox</code>. Keep primary keys as deterministic UUIDv4. Do not wire API sync yet.</p>
                <div class="wl-progress-track"><div class="wl-progress-bar" style="width: 34%"></div></div>
              </div>
            </main>
          </div>
        </div>
      </figure>

      <!-- ================= CANVAS: empty ================= -->
      <figure class="frame">
        <figcaption>canvas · empty</figcaption>
        <div class="phone">
          <div class="wl-root">
            <div class="wl-float-layer">
              <button class="wl-circle-btn wl-float-menu" aria-label="Open navigation">
                <svg class="wl-icon wl-icon-menu" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" /></svg>
              </button>
            </div>
            <main class="wl-directive-container">
              <div class="wl-directive-card">
                <h1 class="wl-serif-title">No active directive.</h1>
                <p class="wl-body-muted">Open the menu to create a goal or review settings.</p>
              </div>
            </main>
          </div>
        </div>
      </figure>

      <!-- ================= CONTROL PANEL: with goals ================= -->
      <figure class="frame">
        <figcaption>control panel</figcaption>
        <div class="phone" style="padding: 0">
          <div class="wl-modal-backdrop wl-nav-backdrop" style="position: absolute">

                  </span>

                </button>

                    </span>
                    <span class="wl-nav-row-label">Entropy Log</span>
                    <span class="wl-nav-chevron">
                      <svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg>
                    </span>
                  </button>
                  <button class="wl-nav-row">
                    <span class="wl-nav-row-icon">
                      <svg class="wl-icon wl-icon-velocity" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.75 13.25a7.5 7.5 0 0 1 12.5 0" /><path d="M9 13.25 12.4 7.9" /><path d="M9 13.25h.01" /></svg>
                    </span>
                    <span class="wl-nav-row-label">Trajectory</span>
                    <span class="wl-nav-chevron">
                      <svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg>
                    </span>
                  </button>
                </div>
                <div class="wl-nav-group wl-nav-worldlines">
                  <div class="wl-nav-label">Active worldlines</div>
                  <div class="wl-worldline">
                    <div class="wl-worldline-top">
                      <span class="wl-worldline-title">Ship Worldline v0.1</span>
                      <span class="wl-worldline-count">3 / 7</span>
                    </div>
                    <div class="wl-worldline-track"><div class="wl-worldline-fill" style="width: 43%"></div></div>
                  </div>
                  <div class="wl-worldline">

                    </div>
                    <div class="wl-worldline-track"><div class="wl-worldline-fill" style="width: 0%"></div></div>
                  </div>
                  <p class="wl-nav-more">+2 more</p>
                </div>
              </div>
              <div class="wl-nav-foot">
                <button class="wl-nav-row">
                  <span class="wl-nav-row-icon">
                    <svg class="wl-icon wl-icon-settings" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.05 9.15 L22.23 9.64 A10.5 10.5 0 0 1 22.23 14.36 L19.05 14.85 A7.6 7.6 0 0 1 17.99 16.68 M17.99 16.68 L19.16 19.68 A10.5 10.5 0 0 1 15.07 22.04 L13.06 19.53 A7.6 7.6 0 0 1 10.94 19.53 M10.94 19.53 L8.93 22.04 A10.5 10.5 0 0 1 4.84 19.68 L6.01 16.68 A7.6 7.6 0 0 1 4.95 14.85 M4.95 14.85 L1.77 14.36 A10.5 10.5 0 0 1 1.77 9.64 L4.95 9.15 A7.6 7.6 0 0 1 6.01 7.32 M6.01 7.32 L4.84 4.32 A10.5 10.5 0 0 1 8.93 1.96 L10.94 4.47 A7.6 7.6 0 0 1 13.06 4.47 M13.06 4.47 L15.07 1.96 A10.5 10.5 0 0 1 19.16 4.32 L17.99 7.32 A7.6 7.6 0 0 1 19.05 9.15 M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z" /></svg>
                  </span>
                  <span class="wl-nav-row-label">Settings</span>
                  <span class="wl-nav-chevron">
                    <svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- ================= SETTINGS: top ================= -->
      <figure class="frame">
        <figcaption>settings · top</figcaption>
        <div class="phone">
          <div class="wl-page">
            <div class="wl-page-head">

            <div class="wl-scroll-region">

                <div class="wl-fieldset">

                  <p class="wl-hint">The phrase is never written to the database or the relay. Local directives work without it; sync and AI keys need it unlocked.</p>
                </div>
              </section>
              <section class="wl-section">
                <h2 class="wl-section-title">Appearance</h2>
                <div class="wl-fieldset">
                  <button class="wl-switch" role="switch" aria-checked="true">
                    <span class="wl-switch-label">Dark graphite</span>
                    <span class="wl-switch-track">
                      <span class="wl-switch-knob">
                        <svg class="wl-icon wl-icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
                      </span>
                    </span>
                  </button>
                </div>
              </section>
              <section class="wl-section">
                <h2 class="wl-section-title">Intelligence</h2>
                <div class="wl-fieldset">
                  <button class="wl-value-row">
                    <span class="wl-value-row-label">AI provider</span>
                    <span class="wl-value-row-value">OpenRouter</span>
                    <span class="wl-value-row-go"><svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg></span>
                  </button>
                  <p class="wl-hint">Manual mode plans goals from your own words and makes no API calls. Choosing a provider lets the architect name the goal and build the milestone tree.</p>
                </div>
                <div class="wl-fieldset">
                  <button class="wl-value-row">
                    <span class="wl-value-row-label">Architect model</span>
                    <span class="wl-value-row-value">nvidia/nemotron-3.5-lightning:free</span>
                    <span class="wl-value-row-meta">128k context</span>
                    <span class="wl-value-row-go"><svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg></span>
                  </button>
                </div>
                <div class="wl-fieldset">
                  <button class="wl-value-row">
                    <span class="wl-value-row-label">Dispatcher model</span>
                    <span class="wl-value-row-value wl-value-row-value--empty">Not selected</span>
                    <span class="wl-value-row-go"><svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg></span>
                  </button>
                </div>
              </section>
            </div>
          </div>
        </div>
      </figure>

      <!-- ================= SETTINGS: bottom ================= -->
      <figure class="frame">
        <figcaption>settings · bottom</figcaption>
        <div class="phone">
          <div class="wl-page">
            <div class="wl-page-head">
              <button class="wl-circle-btn wl-back" aria-label="Back to the line">
                <svg class="wl-icon wl-icon-back" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" /></svg>
              </button>
              <h1 class="wl-page-title">Settings</h1>
            </div>
            <div class="wl-scroll-region" style="padding-top: 320px">
              <section class="wl-section">
                <h2 class="wl-section-title">Intelligence</h2>
                <div class="wl-fieldset">
                  <div class="wl-catalog-status">
                    <span class="wl-mono">443 models · cached</span>
                    <button class="wl-btn-ghost wl-btn-compact">Refresh models</button>
                  </div>
                </div>
                <div class="wl-fieldset">
                  <span class="wl-fieldset-label">API key</span>
                  <input class="wl-input wl-input--mono" type="password" placeholder="Sealed into this device's vault" />
                  <div class="wl-inline-actions">
                    <button class="wl-btn-ghost">Replace vault key</button>
                    <span class="wl-chip">sealed</span>
                    <button class="wl-btn-ghost wl-btn-compact wl-btn-danger">Remove</button>
                  </div>
                  <p class="wl-hint">Sealed into the local Stronghold vault, then cleared from this field. Never written to the database, never sent to the relay.</p>
                </div>
              </section>
              <section class="wl-section">
                <h2 class="wl-section-title">Sync</h2>
                <div class="wl-fieldset">
                  <span class="wl-fieldset-label">Relay URL</span>
                  <input class="wl-input wl-input--mono" type="text" value="http://127.0.0.1:8080" />
                  <div class="wl-inline-actions">
                    <button class="wl-btn-ghost wl-btn-compact">Test connection</button>
                  </div>
                </div>
                <div class="wl-fieldset">
                  <button class="wl-sync-cta">
                    <span class="wl-sync-cta-icon">
                      <svg class="wl-icon wl-icon-sync" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.25a6 6 0 0 1 10.2-2.6l1.3 1.35" /><path d="M14 3.25v2.9h-2.9" /><path d="M15.5 10.75a6 6 0 0 1-10.2 2.6L4 12" /><path d="M4 14.75v-2.9h2.9" /></svg>
                    </span>
                    <span>Sync now</span>
                  </button>
                  <p class="wl-status wl-sync-meta">SYNCED · 42s ago</p>
                </div>
              </section>
            </div>
          </div>
        </div>
      </figure>

      <!-- ================= COMPOSE ================= -->
      <figure class="frame">
        <figcaption>compose</figcaption>
        <div class="phone">
          <div class="wl-page">
            <div class="wl-page-bar">
              <button class="wl-circle-btn wl-back" aria-label="Back to the line">
                <svg class="wl-icon wl-icon-back" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" /></svg>

            <div class="wl-actions-row">

            </div>

        </div>

                <button class="wl-picker-row">

                </button>

                  <span class="wl-picker-row-id">openai/gpt-5.4</span>
                  <span class="wl-picker-row-name">OpenAI: GPT-5.4</span>
                  <span class="wl-picker-row-ctx">1.1M</span>

                <div class="wl-picker-group">All models</div>
                <button class="wl-picker-row">

            <div class="wl-page-head">
              <button class="wl-circle-btn wl-back" aria-label="Back to the line">
                <svg class="wl-icon wl-icon-back" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" /></svg>
              </button>
              <h1 class="wl-page-title">Trajectory</h1>
            </div>
            <div class="wl-scroll-region">
              <div class="wl-directive-card wl-traj-card">
                <div class="wl-traj-pace">
                  <span class="wl-traj-pace-label">Easing</span>
                  <span class="wl-traj-pace-note">observed</span>
                </div>
                <div class="wl-traj-grid">
                  <div class="wl-traj-cell"><span class="wl-traj-k">Remaining scope</span><span class="wl-traj-v">3</span><span class="wl-traj-u">milestones</span></div>
                  <div class="wl-traj-cell"><span class="wl-traj-k">Days to horizon</span><span class="wl-traj-v">21</span><span class="wl-traj-u">days</span></div>
                  <div class="wl-traj-cell"><span class="wl-traj-k">Required velocity</span><span class="wl-traj-v">0.14</span><span class="wl-traj-u">per day</span></div>
                  <div class="wl-traj-cell"><span class="wl-traj-k">Rolling average</span><span class="wl-traj-v">0.80</span><span class="wl-traj-u">completion</span></div>
                </div>
                <p class="wl-body-muted wl-traj-formula">V_target = remaining milestones / remaining days</p>
              </div>
            </div>
          </div>
        </div>
      </figure>

      <!-- ================= SEED VAULT ================= -->
      <figure class="frame">
        <figcaption>seed vault</figcaption>
        <div class="phone">
          <div class="wl-scroll-region">
            <section class="wl-seed-vault">
              <div class="wl-seed-header">
                <h2 class="wl-serif-title">Secret <span class="wl-italic-accent">recovery</span> phrase</h2>
                <p class="wl-seed-sub">Write these down in exact sequence. Worldline has no email servers to recover them.</p>
              </div>
              <div class="wl-seed-grid">
                <div class="wl-seed-token"><span class="wl-seed-num">01</span> beacon</div>
                <div class="wl-seed-token"><span class="wl-seed-num">02</span> orbit</div>
                <div class="wl-seed-token"><span class="wl-seed-num">03</span> silence</div>
                <div class="wl-seed-token"><span class="wl-seed-num">04</span> dynamic</div>
                <div class="wl-seed-token"><span class="wl-seed-num">05</span> marble</div>
                <div class="wl-seed-token"><span class="wl-seed-num">06</span> drift</div>
                <div class="wl-seed-token"><span class="wl-seed-num">07</span> lattice</div>
                <div class="wl-seed-token"><span class="wl-seed-num">08</span> kinetic</div>
                <div class="wl-seed-token"><span class="wl-seed-num">09</span> harbor</div>
                <div class="wl-seed-token"><span class="wl-seed-num">10</span> canyon</div>
                <div class="wl-seed-token"><span class="wl-seed-num">11</span> velvet</div>
                <div class="wl-seed-token"><span class="wl-seed-num">12</span> anchor</div>
              </div>
              <button class="wl-btn-primary">I saved the words</button>
            </section>
          </div>
        </div>
      </figure>

      <!-- ================= LIGHT THEME ================= -->
      <figure class="frame">
        <figcaption>light parchment</figcaption>
        <div class="phone" data-theme="light" style="--wl-canvas: var(--wl-light-canvas); --wl-surface-card: var(--wl-light-card); --wl-surface-elevated: var(--wl-light-elevated); --wl-text-primary: var(--wl-light-text-primary); --wl-text-secondary: var(--wl-light-text-secondary); --wl-text-muted: var(--wl-light-text-muted); --wl-border-subtle: rgba(29,28,19,0.10); --wl-border-strong: rgba(29,28,19,0.18); --wl-accent-coral: #D8583B; --wl-cta-bg: var(--wl-light-cta); --wl-text-inverse: var(--wl-light-cta-text); color-scheme: light">
          <div class="wl-page">
            <div class="wl-page-head">
              <button class="wl-circle-btn wl-back" aria-label="Back to the line">
                <svg class="wl-icon wl-icon-back" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3.5 5.5 9l5.5 5.5" /></svg>
              </button>
              <h1 class="wl-page-title">Settings</h1>
            </div>
            <div class="wl-scroll-region">
              <section class="wl-section">
                <h2 class="wl-section-title">Appearance</h2>
                <div class="wl-fieldset">
                  <button class="wl-switch" role="switch" aria-checked="false">
                    <span class="wl-switch-label">Light parchment</span>
                    <span class="wl-switch-track">
                      <span class="wl-switch-knob">
                        <svg class="wl-icon wl-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 1 0 0-10Z" /><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" /></svg>
                      </span>
                    </span>
                  </button>
                </div>
              </section>
              <section class="wl-section">
                <h2 class="wl-section-title">Intelligence</h2>
                <div class="wl-fieldset">
                  <button class="wl-value-row">
                    <span class="wl-value-row-label">AI provider</span>
                    <span class="wl-value-row-value wl-value-row-value--empty">None — manual mode</span>
                    <span class="wl-value-row-go"><svg class="wl-icon wl-icon-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.25 4.5 12.75 9l-5.5 4.5" /></svg></span>
                  </button>
                  <p class="wl-hint">Manual mode plans goals from your own words and makes no API calls.</p>
                </div>
              </section>
            </div>
          </div>
        </div>
      </figure>


      <!-- ================= FOCUS RING REGRESSION =================
           Reproduces the boot state: the canvas root carries
           tabindex="0" and is focused programmatically so it can receive
           ⌘+Enter and Escape. The `:focus` class stands in for the
           real focus. The frame must show NO coral ring — the ring is for
           controls, and this element is an event target. -->
      <figure class="frame">
        <figcaption>canvas · focused root (no ring)</figcaption>
        <div class="phone">
          <div class="wl-root" tabindex="0" autofocus>
            <div class="wl-float-layer">
              <button class="wl-circle-btn wl-float-menu" aria-label="Open navigation">
                <svg class="wl-icon wl-icon-menu" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" /></svg>
              </button>
            </div>
            <main class="wl-directive-container">
              <div class="wl-directive-card">
                <h1 class="wl-serif-title">No active directive.</h1>
                <p class="wl-body-muted">Open the menu to create a goal or review settings.</p>
              </div>
            </main>
          </div>
        </div>
      </figure>
    </div>
  </body>
</html>
