[package]
name = "wl-ui"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-web = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[features]
default = ["web"]
web = []
