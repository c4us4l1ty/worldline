[package]
name = "wl-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wl-relay"
path = "src/main.rs"

[features]
default = ["sqlite"]
# Dev/test backend: zero-infrastructure SQLite. Production: Postgres.
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:rusqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]

[dependencies]
wl-core = { workspace = true }
wl-protocol = { path = "../wl-protocol" }
axum.workspace = true
tower.workspace = true
tower-http = { version = "0.6", features = ["timeout"] }
# The binary drives its own accept loop rather than `axum::serve`, so
# that a connection which never finishes its request head can be
# bounded: tower layers only run once hyper holds a complete request,
# and a header-dribbling client never gets there. `hyper-util` is
# already in the tree as an axum dependency — this makes the existing
# crate direct rather than adding one.
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
uuid = { workspace = true }
ed25519-dalek.workspace = true
sha2.workspace = true

[dev-dependencies]
reqwest.workspace = true
tower.workspace = true
