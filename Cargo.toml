[workspace]
resolver = "2"
members = [
    "crates/wl-core",
    "crates/wl-protocol",
    "crates/wl-relay",
    "crates/wl-sync",
]
default-members = [
    "crates/wl-core",
    "crates/wl-protocol",
    "crates/wl-relay",
    "crates/wl-sync",
]
exclude = ["crates/wl-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Proprietary, all rights reserved (see README). This was the crates.io
# "UNLICENSED" placeholder, which is not a real SPDX identifier: it is
# unparseable, so `cargo deny check licenses` hard-failed all four
# first-party crates as `unlicensed` and the supply-chain gate could
# never go green. A `LicenseRef-` custom identifier states the same
# intent precisely and is accepted by both cargo and cargo-deny.
license = "LicenseRef-Proprietary-AllRightsReserved"
repository = "https://example.invalid/worldline"

[workspace.dependencies]
# Internal crates
wl-core = { path = "crates/wl-core" }
wl-protocol = { path = "crates/wl-protocol" }
wl-sync = { path = "crates/wl-sync" }

# Crypto
bip39 = { version = "2.2", features = ["zeroize", "rand"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.7"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
base64 = "0.22"
subtle = "2.5"
getrandom = "0.2"

# Persistence
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Async / server
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
axum = { version = "0.8", features = ["json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
hyper = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `bincode` was declared here and in wl-core but never used by any source
# file (CRDT op payloads go through serde_json -> ChaCha20-Poly1305).
# Dropped rather than kept: an unmaintained dependency that nothing
# imports is pure supply-chain surface, and it was the only thing making
# `cargo deny check advisories` red.

# Utility
thiserror = "2.0"
anyhow = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
urlencoding = "2.1"
pasetors = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
